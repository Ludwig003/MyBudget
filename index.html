  // ---------- Խորհրդատու ----------
  function monthlySavingRate() {
    const now = new Date(), vals = [];
    for (let k = 1; k <= 3; k++) {
      const d = new Date(now.getFullYear(), now.getMonth() - k, 1), mk = monthKey(d);
      const inc = sum(state.data.incomes.filter(x => x.date.slice(0, 7) === mk), x => x.amount);
      const sp = sum(state.data.expenses.filter(x => x.date.slice(0, 7) === mk && isSpend(x)), x => x.amount);
      if (inc > 0 || sp > 0) vals.push(inc - sp);
    }
    if (vals.length) return sum(vals, v => v) / vals.length;
    const sEnv = savingsEnv();
    const inc = monthIncome();
    return sEnv && inc ? inc * sEnv.percent / 100 : 0;
  }
  function advisorPanel() {
    const pf = state.pf;
    let result = '';
    if (pf.price) {
      const price = pf.price, s = safeToday(), sEnv = savingsEnv();
      const flex = s ? s.flexible : 0, savBal = sEnv ? balanceOf(sEnv) : 0;
      let lines = [];
      if (s && price <= s.left) lines.push(t('adv.yesToday'));
      else if (s && price <= flex) lines.push(t('adv.yes', { a: amd(s.perDay), b: amd(Math.max(0, flex - price) / s.daysLeft) }));
      else if (price <= flex + savBal) lines.push(t('adv.savings', { v: amd(savBal - (price - flex)) }));
      else {
        const short = price - flex - Math.max(0, savBal);
        lines.push(t('adv.no', { v: amd(short) }));
        const rate = monthlySavingRate();
        lines.push(rate > 0 ? t('adv.eta', { r: amd(rate), n: Math.max(1, Math.ceil(short / rate)) }) : t('adv.noRate'));
        lines.push('<button class="btn btn-primary" style="margin-top:10px" data-action="adv-goal">' + t('adv.makeGoal') + '</button>');
      }
      result = '<div class="card stack" style="margin-top:12px">' + lines.map(l => l.indexOf('<button') === 0 ? l : '<div>' + esc(l) + '</div>').join('') +
        '<div class="small muted">' + t('adv.note') + '</div></div>';
    }
    return '<div class="muted" style="margin:4px 4px 12px">' + t('adv.sub') + '</div><div class="card stack">' +
      '<input class="field big" id="adv-price" inputmode="decimal" placeholder="' + t('adv.price') + '" value="' + (pf.price ? esc(String(pf.price)) : '') + '">' +
      '<input class="field" id="adv-what" maxlength="40" placeholder="' + t('adv.what') + '" value="' + esc(pf.what || '') + '">' +
      '<button class="btn btn-primary" data-action="adv-check">' + t('adv.check') + '</button></div>' + result;
  }

  // ---------- Ամսվա ամփոփում (Wrapped) ----------
  function wrappedStats(mk) {
    const d = state.data;
    const inM = x => x.date.slice(0, 7) === mk;
    const inc = d.incomes.filter(inM), exp = d.expenses.filter(x => inM(x) && isSpend(x)), goals = d.expenses.filter(x => inM(x) && x.goalId);
    const [y, m] = mk.split('-').map(Number);
    const prevKey = monthKey(new Date(y, m - 2, 1));
    const prevSpent = sum(d.expenses.filter(x => x.date.slice(0, 7) === prevKey && isSpend(x)), x => x.amount);
    const spent = sum(exp, x => x.amount), income = sum(inc, x => x.amount);
    const byEnv = {}; exp.forEach(x => { byEnv[x.envelopeID] = (byEnv[x.envelopeID] || 0) + x.amount; });
    const topId = Object.keys(byEnv).sort((a, b) => byEnv[b] - byEnv[a])[0];
    const byWd = [0, 0, 0, 0, 0, 0, 0]; exp.forEach(x => { byWd[toDate(x.date).getDay()] += x.amount; });
    const busiest = spent ? byWd.indexOf(Math.max(...byWd)) : -1;
    const biggest = exp.slice().sort((a, b) => b.amount - a.amount)[0];
    const now = new Date(), lastDay = (y === now.getFullYear() && m - 1 === now.getMonth()) ? now.getDate() - 1 : daysInMonth(y, m - 1);
    let noSpend = 0;
    for (let i = 1; i <= lastDay; i++) { const iso = y + '-' + pad(m) + '-' + pad(i); if (!exp.some(x => x.date === iso)) noSpend++; }
    return { mk: mk, y: y, m: m, income: income, spent: spent, saved: income - spent, prevSpent: prevSpent, top: topId ? { env: envById(topId), amount: byEnv[topId] } : null,
      busiest: busiest, biggest: biggest, tx: inc.length + exp.length + goals.length, goals: sum(goals, x => x.amount), noSpend: noSpend, streak: streakInfo().best,
      empty: !inc.length && !exp.length && !goals.length };
  }
  function changeText(w) {
    if (!w.prevSpent) return '';
    const p = Math.round((w.spent - w.prevSpent) / w.prevSpent * 100);
    return (p === 0 ? t('wr.same') : p > 0 ? t('wr.more', { p: p }) : t('wr.less', { p: -p })) + ' ' + t('wr.vsPrev');
  }
  function wrappedPanel() {
    const now = new Date();
    const months = [0, 1, 2, 3, 4, 5].map(k => monthKey(new Date(now.getFullYear(), now.getMonth() - k, 1)));
    const mk = state.pf.mk || months[0];
    const w = wrappedStats(mk);
    const chips = '<div class="chips" style="margin-bottom:12px">' + months.map(k => {
      const [y, m] = k.split('-').map(Number);
      return '<button class="chip' + (k === mk ? ' on' : '') + '" data-action="wr-month" data-id="' + k + '">' + MONTHS_NOM[lang][m - 1].slice(0, 3) + ' ' + String(y).slice(2) + '</button>';
    }).join('') + '</div>';
    if (w.empty) return chips + '<div class="card muted">' + t('wr.empty') + '</div>';
    const ch = changeText(w);
    const cards = [
      '<div class="wr-card wr-hero"><div class="small" style="opacity:.8">' + MONTHS_NOM[lang][w.m - 1] + ' ' + w.y + '</div>' +
        '<div class="wr-big">' + amd(w.spent) + '</div><div>' + t('wr.spent') + (ch ? ' · ' + esc(ch) : '') + '</div></div>',
      '<div class="wr-grid"><div class="wr-card"><span>' + t('wr.income') + '</span><b style="color:var(--green)">' + amd(w.income) + '</b></div>' +
        '<div class="wr-card"><span>' + t('wr.saved') + '</span><b style="color:' + (w.saved >= 0 ? 'var(--accent)' : 'var(--red)') + '">' + amd(w.saved) + '</b></div>' +
        '<div class="wr-card"><span>' + t('wr.tx') + '</span><b>' + w.tx + '</b></div>' +
        '<div class="wr-card"><span>' + t('wr.noSpend') + '</span><b>' + w.noSpend + '</b></div></div>',
      w.top ? '<div class="wr-card"><span>' + t('wr.topEnv') + '</span><b>' + esc((w.top.env ? w.top.env.icon + ' ' + envName(w.top.env) : '—')) + ' · ' + amd(w.top.amount) + '</b></div>' : '',
      w.biggest ? '<div class="wr-card"><span>' + t('wr.biggest') + '</span><b>' + amd(w.biggest.amount) + (w.biggest.note ? ' · ' + esc(w.biggest.note) : '') + '</b></div>' : '',
      w.busiest >= 0 ? '<div class="wr-card"><span>' + t('wr.busiest') + '</span><b>' + WEEK_FULL[lang][w.busiest] + '</b></div>' : '',
      w.goals ? '<div class="wr-card"><span>' + t('wr.goals') + '</span><b>🎯 ' + amd(w.goals) + '</b></div>' : ''
    ].join('');
    return chips + cards + '<button class="btn btn-primary" style="margin-top:14px" data-action="wr-share">' + t('wr.share') + '</button>';
  }

  async function shareWrapped() {
    const w = wrappedStats(state.pf.mk || monthKey(new Date()));
    const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, W, H); grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(1, '#03061c');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    try {
      const logo = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'icon-192.png'; });
      g.drawImage(logo, 80, 80, 120, 120);
    } catch (e) {}
    const font = (s, wgt) => wgt + ' ' + s + 'px -apple-system, "Noto Sans Armenian", "Segoe UI", sans-serif';
    g.fillStyle = '#fff'; g.font = font(54, '700'); g.fillText('MyBudget', 230, 160);
    g.fillStyle = '#34d399'; g.font = font(44, '600'); g.fillText(MONTHS_NOM[lang][w.m - 1] + ' ' + w.y, 80, 300);
    const rows = [[t('wr.spent'), amd(w.spent)], [t('wr.income'), amd(w.income)], [t('wr.saved'), amd(w.saved)],
      [t('wr.topEnv'), w.top && w.top.env ? envName(w.top.env) : '—'], [t('wr.noSpend'), String(w.noSpend)], ['🔥', t('streak.days', { n: w.streak })]];
    let y = 420;
    rows.forEach(r => {
      g.fillStyle = 'rgba(255,255,255,.65)'; g.font = font(36, '500'); g.fillText(r[0], 80, y);
      g.fillStyle = '#fff'; g.font = font(64, '700'); g.fillText(r[1], 80, y + 72); y += 150;
    });
    const ch = changeText(w);
    if (ch) { g.fillStyle = '#93c5fd'; g.font = font(34, '500'); g.fillText(ch, 80, H - 70); }
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    const file = new File([blob], 'MyBudget-' + w.mk + '.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'MyBudget' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ---------- Չեկի սկանավորում (Tesseract.js) ----------
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  function downscale(file, max) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.filter = 'grayscale(1) contrast(1.3)'; g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c);
      };
      img.onerror = rej; img.src = url;
    });
  }
  function parseReceipt(text) {
    const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
    const nums = s => (s.replace(/(\d)[\s',](?=\d{3}(?!\d))/g, '$1').match(/\d+(?:[.,]\d{1,2})?/g) || []).map(x => parseFloat(x.replace(',', '.')));
    const KEY = /(ընդամենը|ընդհանուր|վճարման|վճարվ|total|sum|итого|всего|к оплате|сумма)/i;
    let amount = 0;
    for (let i = lines.length - 1; i >= 0 && !amount; i--) {
      if (!KEY.test(lines[i])) continue;
      let ns = nums(lines[i]).filter(n => n >= 10 && n < 10000000);
      if (!ns.length && i + 1 < lines.length) ns = nums(lines[i + 1]).filter(n => n >= 10 && n < 10000000);
      if (ns.length) amount = Math.max(...ns);
    }
    if (!amount) {
      const all = lines.reduce((a, l) => a.concat(nums(l)), []).filter(n => n >= 10 && n < 5000000);
      amount = all.length ? Math.max(...all) : 0;
    }
    const shop = (lines.find(l => /\p{L}{3,}/u.test(l)) || '').replace(/[^\p{L}\p{N}\s"«»'&.-]/gu, '').trim().slice(0, 40);
    return { amount: Math.round(amount), shop: shop };
  }
  async function scanReceipt(file) {
    const st = document.getElementById('receipt-status');
    const set = (txt, cls) => { const el = document.getElementById('receipt-status'); if (el) { el.className = cls || 'hint'; el.textContent = txt; } };
    if (!st) return;
    set(t('ocr.loading'));
    try {
      if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const img = await downscale(file, 1600);
      const res = await window.Tesseract.recognize(img, 'hye+rus+eng', {
        logger: m => { if (m.status === 'recognizing text') set(t('ocr.reading', { p: Math.round(m.progress * 100) })); }
      });
      const r = parseReceipt(res.data.text || '');
      if (!r.amount) { set(t('ocr.notFound'), 'error'); return; }
      formCur = 'AMD';
      document.querySelectorAll('#exp-cur .chip').forEach(b => b.classList.toggle('on', b.dataset.id === 'AMD'));
      const a = document.getElementById('exp-amount'); if (a) { a.value = String(r.amount); a.dispatchEvent(new Event('input', { bubbles: true })); }
      const n = document.getElementById('exp-note'); if (n && !n.value && r.shop) n.value = r.shop;
      set(t('ocr.found', { v: amd(r.amount) }), 'ok');
    } catch (e) { set(t('ocr.failed'), 'error'); }
  }

  // ---------- Պանելներ (պատուհաններ) ----------
  const PANELS = {
    goals: ['goal.title', goalsPanel], recurring: ['rec.title', recurringPanel], debts: ['debt.title', debtsPanel],
    challenges: ['ch.title', challengesPanel], advisor: ['adv.title', advisorPanel], wrapped: ['wr.title', wrappedPanel]
  };
  function openPanel(name, pf) { state.panel = name; state.pf = pf || {}; renderPanel(); }
  function renderPanel() {
    if (!state.panel || !PANELS[state.panel]) return;
    const old = document.getElementById('panel-sheet'), top = old ? old.scrollTop : 0;
    const p = PANELS[state.panel];
    modal.innerHTML = '<div class="overlay"><div class="sheet tall" id="panel-sheet"><div class="sheet-head"><span style="width:70px"></span><b>' + t(p[0]) + '</b>' +
      '<button class="link bold" data-action="close-modal" style="width:70px;text-align:right">' + t('m.close') + '</button></div>' + p[1]() + '</div></div>';
    const sh = document.getElementById('panel-sheet'); if (sh) sh.scrollTop = top;
  }
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  function afterChange() { save(); checkBadges(); render(); renderPanel(); }

  /** Նոր ֆունկցիաների կոճակների մշակում. վերադարձնում է true, եթե գործողությունը մշակվեց */
  function featureAction(action, id, el) {
    const d = state.data;
    switch (action) {
      case 'open-panel': closeModal(); openPanel(id); return true;
      case 'tip-next': tipOffset++; render(); return true;
      case 'checkin':
        if (d.checkins.indexOf(todayISO()) < 0) d.checkins.push(todayISO());
        d.checkins = d.checkins.slice(-400); save(); checkBadges(); render(); return true;
      case 'env-daily': { const e = envById(id); if (e) { e.daily = !e.daily; save(); render(); } return true; }
      case 'pick-cur': {
        formCur = id;
        document.querySelectorAll('#' + el.dataset.for + '-cur .chip').forEach(b => b.classList.toggle('on', b.dataset.id === id));
        if (el.dataset.for === 'inc') updateIncomePreview(); else updateExpenseInfo();
        return true;
      }
      // Նպատակներ
      case 'goal-emoji': state.pf.emoji = id; state.pf.name = val('goal-name'); state.pf.target = val('goal-target'); renderPanel(); return true;
      case 'goal-create': {
        const name = val('goal-name').trim(), target = parseAmount(val('goal-target'));
        if (!name || !target) { state.pf.err = 'goal.badInput'; state.pf.name = name; state.pf.target = val('goal-target'); renderPanel(); return true; }
        d.goals.push({ id: uid(), name: name, emoji: state.pf.emoji || '🎯', target: Math.round(target), deadline: val('goal-deadline') || '', created: Date.now() });
        state.pf = {}; afterChange(); return true;
      }
      case 'goal-add': state.pf.addTo = id; renderPanel(); setTimeout(() => { const a = document.getElementById('goal-amt'); if (a) a.focus(); }, 50); return true;
      case 'goal-add-cancel': state.pf.addTo = null; renderPanel(); return true;
      case 'goal-add-save': {
        const amount = parseAmount(val('goal-amt')), g = d.goals.find(x => x.id === id), envId = val('goal-env');
        if (!amount || !g || !envById(envId)) return true;
        d.expenses.push({ id: uid(), amount: Math.round(amount), note: '🎯 ' + g.name, date: todayISO(), envelopeID: envId, goalId: g.id, createdAt: Date.now() });
        state.pf.addTo = null; afterChange(); return true;
      }
      case 'goal-del':
        confirmDialog(t('goal.delTitle'), t('goal.delMsg'), t('m.delete'), () => {
          d.goals = d.goals.filter(g => g.id !== id); d.expenses = d.expenses.filter(x => x.goalId !== id);
          openPanel('goals'); afterChange();
        }); return true;
      // Կրկնվող
      case 'rec-create': {
        const name = val('rec-name').trim(), amount = parseAmount(val('rec-amount'));
        if (!name || !amount) { state.pf.err = 'goal.badInput'; renderPanel(); return true; }
        d.recurring.push({ id: uid(), name: name, amount: Math.round(amount), envelopeID: val('rec-env'), day: parseInt(val('rec-day'), 10) || 1, paidMonth: '' });
        state.pf = {}; afterChange(); return true;
      }
      case 'rec-pay': payRecurring(id); checkBadges(); render(); renderPanel(); toast('✓ ' + t('rec.paid')); return true;
      case 'rec-del':
        confirmDialog(t('rec.delTitle'), t('rec.delMsg'), t('m.delete'), () => { d.recurring = d.recurring.filter(r => r.id !== id); openPanel('recurring'); afterChange(); });
        return true;
      // Պարտքեր
      case 'debt-type': state.pf.type = id; renderPanel(); return true;
      case 'debt-create': {
        const person = val('debt-person').trim(), amount = parseAmount(val('debt-amount'));
        if (!person || !amount) { state.pf.err = 'debt.badInput'; renderPanel(); return true; }
        d.debts.push({ id: uid(), type: state.pf.type || 'lent', person: person, amount: Math.round(amount), note: val('debt-note').trim(), due: val('debt-due') || '', settled: false, created: Date.now() });
        state.pf = { type: state.pf.type }; afterChange(); return true;
      }
      case 'debt-settle': { const x = d.debts.find(y => y.id === id); if (x) { x.settled = true; x.settledAt = todayISO(); } afterChange(); return true; }
      case 'debt-del':
        confirmDialog(t('debt.delTitle'), '', t('m.delete'), () => { d.debts = d.debts.filter(x => x.id !== id); openPanel('debts'); afterChange(); });
        return true;
      // Խորհրդատու
      case 'adv-check': { const p = parseAmount(val('adv-price')); state.pf = { price: p ? Math.round(p) : 0, what: val('adv-what').trim() }; renderPanel(); return true; }
      case 'adv-goal': openPanel('goals', { name: state.pf.what || '', target: String(state.pf.price || '') }); return true;
      // Ամփոփում
      case 'wr-month': state.pf.mk = id; renderPanel(); return true;
      case 'wr-share': shareWrapped().catch(() => toast(t('err.generic'))); return true;
    }
    return false;
  }

  // ---------- Իրադարձություններ ----------
  document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('overlay')) { closeModal(); return; }

    const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
    const id = el.dataset.id;
    if (state.data && featureAction(el.dataset.action, id, el)) return;
    switch (el.dataset.action) {
      case 'tab': state.tab = id; state.selecting = false; state.selected.clear(); state.flash = {}; render(); try { window.scrollTo(0, 0); } catch (err) {} break;
      case 'lang': setLang(id); break;
      case 'auth-mode': state.authMode = id; state.authError = ''; state.authInfo = ''; render(); break;
      case 'open-income': openIncome(); break;
      case 'open-expense': openExpense(); break;
      case 'close-modal': closeModal(); break;
      case 'confirm-ok': { const fn = onConfirm; closeModal(); if (fn) fn(); break; }
      case 'save-income': saveIncome(); break;
      case 'save-expense': saveExpense(); break;
      case 'pick-env':
        expenseEnvID = id;
        document.querySelectorAll('#exp-envs .pick').forEach(b => b.classList.toggle('on', b.dataset.id === id));
        updateExpenseInfo(); break;
      case 'del-income':
        confirmDialog(t('c.delIncTitle'), t('c.delIncMsg'), t('m.delete'), () => {
          state.data.incomes = state.data.incomes.filter(i => i.id !== id); save(); render();
        }); break;
      case 'del-expense':
        confirmDialog(t('c.delExpTitle'), t('c.delExpMsg'), t('m.delete'), () => {
          state.data.expenses = state.data.expenses.filter(x => x.id !== id); save(); render();
        }); break;
      case 'env-minus': { const env = envById(id); if (env) { env.percent = Math.max(0, env.percent - 5); save(); render(); } break; }
      case 'env-plus': { const env = envById(id); const rem = remaining(); if (env && rem > 0) { env.percent += Math.min(5, rem); save(); render(); } break; }
      case 'env-add': {
        const icons = ['📁','✈️','🎁','🚗','💊','📚','👕','☕️'];
        const n = state.data.envelopes.length;
        state.data.envelopes.push({ id: uid(), key: 'new', name: '', percent: 0, icon: icons[n % icons.length], color: COLOR_KEYS[n % COLOR_KEYS.length] });
        save(); render(); break;
      }
      case 'env-select-start': state.selecting = true; state.selected.clear(); render(); break;
      case 'env-select-cancel': state.selecting = false; state.selected.clear(); render(); break;
      case 'env-toggle': if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id); render(); break;
      case 'env-delete-selected':
        confirmDialog(t('c.delEnvTitle', { n: state.selected.size }), t('c.delEnvMsg'), t('m.delete'), () => {
          deleteEnvelopes(new Set(state.selected)); state.selecting = false; state.selected.clear(); render();
        }); break;
      case 'open-settings': openSettings(); break;
      case 'pin-digit': pinDigit(id); break;
      case 'pin-back': pinBack(); break;
      case 'pin-skip': updateAccount(me => { me.pinSkipped = true; }); state.screen = 'app'; render(); break;
      case 'pin-cancel': finishToSettings('', true); state.sflash = {}; renderSettings(); break;
      case 'pin-forgot': logout('pin.forgotMsg'); break;
      case 'pin-setup-settings': startPinSetup(true); break;
      case 'pin-remove':
        confirmDialog(t('c.pinRemoveTitle'), t('c.pinRemoveMsg'), t('c.remove'), () => {
          updateAccount(me => { delete me.pin; delete me.bio; me.pinAttempts = 0; me.pinSkipped = true; });
          finishToSettings('set.pinRemoved', true);
        }); break;
      case 'bio-unlock':
        bioVerify().then(() => { updateAccount(me => { me.pinAttempts = 0; }); state.screen = 'app'; render(); })
          .catch(() => { state.pin.error = { key: 'bio.failed' }; render(); });
        break;
      case 'bio-enable-offer':
        bioRegister().then(() => { state.screen = 'app'; render(); })
          .catch(() => { state.bioError = 'bio.unavailable'; render(); });
        break;
      case 'bio-later': state.bioError = ''; state.screen = 'app'; render(); break;
      case 'bio-on':
        bioRegister().then(() => { state.sflash = { sec: 'security', ok: true, key: 'bio.enabled' }; refresh(); })
          .catch(() => { state.sflash = { sec: 'security', key: 'bio.unavailable' }; refresh(); });
        break;
      case 'bio-off': updateAccount(me => { delete me.bio; }); state.sflash = { sec: 'security', ok: true, key: 'bio.disabled' }; refresh(); break;
      case 'subscribe': {
        const input = document.getElementById('sub-email');
        const email = input ? input.value.trim() : '';
        state.flash = {};
        if (!isEmail(email)) { state.flash.sub = 'profile.badEmail'; render(); restoreEmail(email); break; }
        el.disabled = true;
        sb.from('subscribers').insert({ user_id: state.uid, email: email })
          .then(({ error }) => {
            if (error) throw error;
            state.data.profile.subscribedEmail = email; save(); render();
          })
          .catch(err => { state.flash.sub = errKey(err); render(); restoreEmail(email); });
        break;
      }
      case 'save-name': {
        const input = document.getElementById('display-name');
        const name = input ? input.value.trim().slice(0, 40) : '';
        saveProfile({ display_name: name })
          .then(() => { state.data.profile.displayName = name; state.sflash = { sec: 'name', ok: true, key: 'profile.saved' }; refresh(); })
          .catch(err => { state.sflash = { sec: 'name', key: errKey(err) }; refresh(); });
        break;
      }
      case 'avatar-remove':
        saveProfile({ avatar_url: '' })
          .then(() => { state.data.profile.avatar = ''; state.sflash = {}; refresh(); })
          .catch(err => { state.sflash = { sec: 'photo', key: errKey(err) }; refresh(); });
        break;
      case 'save-username': {
        const input = document.getElementById('new-username');
        const value = input ? input.value : '';
        el.disabled = true;
        changeUsername(value)
          .then(() => { state.sflash = { sec: 'username', ok: true, key: 'set.usernameSaved' }; refresh(); })
          .catch(err => {
            state.sflash = { sec: 'username', key: errKey(err) }; refresh();
            const again = document.getElementById('new-username'); if (again && !again.disabled) again.value = value;
          });
        break;
      }
      case 'save-password': {
        const v = i => { const el = document.getElementById(i); return el ? el.value : ''; };
        changePassword(v('cur-pass'), v('new-pass'), v('new-pass2'))
          .then(() => { state.sflash = { sec: 'password', ok: true, key: 'set.passSaved' }; refresh(); })
          .catch(err => { state.sflash = { sec: 'password', key: errKey(err) }; refresh(); });
        break;
      }
      case 'logout': confirmDialog(t('c.logoutTitle'), t('c.logoutMsg'), t('c.logoutOk'), () => logout()); break;
    }
  });

  function restoreEmail(email) {
    const input = document.getElementById('sub-email');
    if (input) { input.value = email; updateSubscribeLink(); }
  }

  document.addEventListener('input', e => {
    const tg = e.target;
    if (tg.id === 'inc-amount') updateIncomePreview();
    else if (tg.id === 'exp-amount') updateExpenseInfo();
    else if (tg.id === 'sub-email') updateSubscribeLink();
    else if (tg.dataset && tg.dataset.envName) {
      const env = envById(tg.dataset.envName);
      if (env) { env.name = tg.value.trim() || t('env.unnamed'); save(); }
    }
  });

  document.addEventListener('change', e => {
    if (e.target.id === 'avatar-input' && e.target.files && e.target.files[0]) loadAvatar(e.target.files[0]);
    if (e.target.id === 'receipt-input' && e.target.files && e.target.files[0]) scanReceipt(e.target.files[0]);
  });

  document.addEventListener('keydown', e => {
    if (state.user && (state.screen === 'pin-setup' || state.screen === 'locked') && !modal.innerHTML) {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pinDigit(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); pinBack(); return; }
    }
    if (e.key === 'Escape' && modal.innerHTML) closeModal();
    if (e.key === 'Enter' && e.target.id === 'display-name') { e.preventDefault(); const b = document.querySelector('[data-action="save-name"]'); if (b) b.click(); }
  });

  document.addEventListener('submit', async e => {
    if (e.target.id !== 'auth-form') return;
    e.preventDefault();
    if (state.busy) return;
    if (!sb) { state.authError = 'err.noServer'; render(); return; }
    const f = e.target;
    const val = n => { const el = f.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
    const email = val('email'), username = val('username'), p = val('password'), c = val('confirm');
    const mode = state.recovering ? 'newpass' : state.authMode;
    state.authEmail = email; state.authError = ''; state.authInfo = ''; state.busy = true; render();
    try {
      if (mode === 'login') await login(email, p);
      else if (mode === 'register') await register(email, username, p, c);
      else if (mode === 'reset') { await sendReset(email); state.authInfo = 'auth.linkSent'; }
      else {
        await setNewPassword(p, c);
        state.recovering = false; state.busy = false;
        try { history.replaceState(null, '', location.pathname); } catch (x) {}
        const { data } = await sb.auth.getSession();
        if (data.session) { toast(t('auth.passUpdated')); await enterWithSession(data.session, false, false); return; }
        state.authMode = 'login'; state.authInfo = 'auth.passUpdated';
      }
    } catch (err) {
      state.authError = errKey(err);
    }
    state.busy = false;
    if (!state.user || state.recovering) {
      render();
      const nf = document.getElementById('auth-form');
      if (nf && username) { const u = nf.querySelector('[name="username"]'); if (u) u.value = username; }
    }
  });

  // ---------- Սկիզբ ----------
  async function boot() {
    checkBioAvailable();
    if (!sb) { state.booting = false; state.authError = 'err.noServer'; render(); return; }
    // Գաղտնաբառի վերականգնման հղումով եկած լինելու դեպքում
    if (/type=recovery/.test(location.hash)) state.recovering = true;
    sb.auth.onAuthStateChange(event => {
      if (event === 'PASSWORD_RECOVERY') { state.recovering = true; state.booting = false; state.authError = ''; render(); }
    });
    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session && !state.recovering) { await enterWithSession(data.session, false, true); return; }
    } catch (e) { state.authError = 'err.network'; }
    state.booting = false; render();
  }
  render();
  boot();
})();
</script>
</body>
</html>
