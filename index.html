<style>

    --line: #e5e7eb; --soft: #eef0f4; --accent: #4f46e5;

      --line: #2c2c2e; --soft: #2c2c2e; --accent: #818cf8;
      --green: #22c55e; --orange: #fb923c;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Խոշորացման արգելք. կրկնակի հպումով խոշորացում չկա */
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* iOS-ը ավտոմատ խոշորացնում է 16px-ից փոքր դաշտերը, ուստի նվազագույնը 16px է */
  input, select, textarea { font-size: max(16px, 1em); }

  /* Մեկնարկային վիդեո */
  #splash { position: fixed; inset: 0; z-index: 100; background: #03061c; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }

  #splash.hide { opacity: 0; pointer-events: none; }
  html, body { margin: 0; background: var(--bg); color: var(--text);

    font-size: 16px; line-height: 1.35; }
  button, input { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }

  .shell { max-width: 480px; margin: 0 auto; min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(96px + env(safe-area-inset-bottom)); }
  .title { font-size: 30px; font-weight: 700; margin: 4px 0 16px; letter-spacing: -0.3px; }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin: 22px 4px 8px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 4px 0; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; }
  .stack > * + * { margin-top: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .bold { font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; }
  .spacer { flex: 1; }

  .hello .title { margin: 0; font-size: 26px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .balance { background: linear-gradient(135deg, #4f46e5, #2563eb); color: #fff; border-radius: 22px; padding: 20px; }
  .balance .big { font-size: 34px; font-weight: 700; margin: 6px 0 14px; letter-spacing: -0.5px; }
  .balance .stats { display: flex; justify-content: space-between; gap: 8px; }
  .balance .stats div span { display: block; font-size: 11px; opacity: .8; }
  .balance .stats div b { font-size: 14px; }

  .actions { display: flex; gap: 12px; margin-top: 14px; }
  .action { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 600; font-size: 16px; }
  .action.green { background: rgba(34,197,94,.15); color: var(--green); }
  .action.red { background: rgba(239,68,68,.15); color: var(--red); }

  .icon { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; flex: none; }
  .bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .bar > div { height: 100%; border-radius: 99px; transition: width .25s; }

  .list { background: var(--card); border-radius: 16px; overflow: hidden; }
  .list > .item { padding: 12px 16px; }
  .list > * + * { border-top: 1px solid var(--line); }
  .list-btn { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .accent { color: var(--accent); }
  .danger { color: var(--red); }
  .list-btn:disabled { opacity: .4; cursor: default; }

  .field { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; }

  .field.big { font-size: 24px; font-weight: 600; }
  .field:disabled { opacity: .75; background: var(--soft); }
  .name-input { border: 0; background: transparent; font-weight: 600; font-size: 16px; outline: none; flex: 1; min-width: 0; padding: 2px 0; }
  .name-input:focus { border-bottom: 1px solid var(--accent); }

  .btn { border: 0; border-radius: 12px; padding: 14px; font-weight: 600; width: 100%; font-size: 16px; }
  .btn-primary { background: var(--accent); color: #fff; }

  .btn-small { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; background: var(--accent); color: #fff; white-space: nowrap; }
  .btn-ghost { border: 0; border-radius: 10px; padding: 9px 12px; font-weight: 600; background: var(--soft); white-space: nowrap; font-size: 14px; }
  .step { width: 38px; height: 32px; border-radius: 9px; border: 0; background: var(--soft); font-size: 18px; font-weight: 600; }
  .step:disabled { opacity: .35; cursor: default; }

  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 480px; display: flex;

  .tab { flex: 1; border: 0; background: none; color: var(--muted); font-size: 10.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; min-width: 0; }

  .settings-btn { justify-content: space-between; font-weight: 600; }
  .flags.mini { gap: 6px; }

  .avatar { border-radius: 50%; background: rgba(79,70,229,.15); display: grid; place-items: center; overflow: hidden; flex: none; color: var(--accent); font-weight: 700; }

  .send { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; text-decoration: none; }
  .send svg { width: 20px; height: 20px; }
  .send.off { opacity: .45; pointer-events: none; }
  .send.done { background: var(--green); pointer-events: none; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; justify-content: center; z-index: 20; animation: fade .15s; }
  .overlay.center { align-items: center; padding: 24px; }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0;

  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 6px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .sheet-head b { font-size: 17px; }
  .link { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 6px 2px; }
  .link.bold { font-weight: 600; }
  .link:disabled { opacity: .4; cursor: default; }
  .dialog { width: 100%; max-width: 320px; background: var(--card); border-radius: 16px; padding: 20px 18px 14px; text-align: center; animation: pop .15s; }

  .dialog p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .dialog .row { gap: 10px; }
  .dialog .btn { padding: 12px; }
  .btn-soft { background: var(--soft); }
  .btn-danger { background: var(--red); color: #fff; }

  .check { margin-left: auto; color: var(--accent); font-weight: 700; visibility: hidden; }
  .pick.on .check { visibility: visible; }
  .sel-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: #fff; font-size: 14px; flex: none; }
  .sel-dot.on { background: var(--red); border-color: var(--red); }
  .tx-del { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 4px 6px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .pin-dot.on { background: var(--accent); }
  .pin-msg { min-height: 20px; font-size: 14px; color: var(--red); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px 24px; margin-top: 18px; }
  .pin-key { width: 74px; height: 74px; border-radius: 50%; border: 0; background: var(--card); font-size: 28px; font-weight: 500; display: grid; place-items: center; }

  .pin-key.ghost { background: transparent; }
  .pin-key svg { width: 30px; height: 30px; }
  .pin-links { margin-top: 22px; display: flex; gap: 24px; justify-content: center; }

  .big-emoji { font-size: 56px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #111827; color: #fff;

  .toast.show { opacity: .95; }
  .info { color: var(--green); font-size: 14px; margin: 10px 2px 0; }
  .text-link { border: 0; background: none; color: var(--accent); font-size: 14px; padding: 4px 0; margin-top: 12px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--soft); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes up { from { transform: translateY(40px); opacity: .6 } to { transform: none; opacity: 1 } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pop { from { transform: scale(.95); opacity: 0 } to { transform: none; opacity: 1 } }
</style>

<div id="splash" aria-hidden="true">
  <video id="splash-video" src="mybudget_logo.mp4" muted playsinline webkit-playsinline autoplay preload="auto" disablepictureinpicture></video>
</div>
<script>
  // Մեկնարկային վիդեո. ցույց է տրվում միայն հավելվածը/կայքը բացելիս (մեկ անգամ յուրաքանչյուր բացման ժամանակ)
  (function () {
    var splash = document.getElementById('splash');
    var video = document.getElementById('splash-video');
    var seen = false, reduce = false;
    try { seen = sessionStorage.getItem('bb_splash') === '1'; } catch (e) {}
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (seen || reduce) { splash.parentNode.removeChild(splash); return; }
    try { sessionStorage.setItem('bb_splash', '1'); } catch (e) {}
    var done = false;
    function hide() {
      if (done) return; done = true;
      splash.classList.add('hide');
      setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
    }
    video.addEventListener('ended', hide);
    video.addEventListener('error', hide);
    splash.addEventListener('click', hide);               // հպումով կարելի է բաց թողնել
    setTimeout(hide, 7500);                               // ապահովության համար
    var p = video.play && video.play();
    if (p && p.catch) p.catch(function () { setTimeout(hide, 800); });   // եթե բրաուզերը չթույլատրի ավտոմատ նվագարկումը
  })();

  // Մատներով (pinch) խոշորացման արգելք (iOS Safari-ն անտեսում է user-scalable=no-ն)
  (function () {
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  })();
</script>

  async function sha256(text) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');

    };
  }

  function distribute(amount, envelopes) {
    const active = envelopes.filter(e => e.percent > 0);
    const total = sum(active, e => e.percent);
    if (!(total > 0) || !(amount > 0)) return [];
    let used = 0;
    return active.map((e, i) => {
      const part = i === active.length - 1 ? amount - used : Math.round(amount * e.percent / total);
      used += part;
      return { envelopeID: e.id, amount: part };
    });
  }

  const state = { user: null, data: null, tab: 'home', authMode: 'login', authError: '', selecting: false, selected: new Set(), flash: {}, settingsOpen: false, sflash: {},
    screen: 'app', pin: { mode: 'setup', input: '', first: '', error: null, fromSettings: false, shake: false }, bioAvailable: false, bioError: '',
    uid: null, email: '', profile: null, booting: true, recovering: false, busy: false, authInfo: '', authEmail: '' };

  // ---------- Սերվերի հետ աշխատանք ----------
  /** Սխալը վերածում է թարգմանության բանալու */
  function errKey(err) {
    if (!err) return 'err.generic';
    const m = String(err.message || err.error_description || err || '');
    if (I18N.hy[m]) return m;
    const low = m.toLowerCase();
    if (low.includes('invalid login credentials')) return 'err.wrong';
    if (low.includes('username_cooldown')) return 'set.usernameHint';
    if (low.includes('too_many_attempts')) return 'err.tooMany';
    if (low.includes('email not confirmed')) return 'err.notConfirmed';
    if (low.includes('already registered') || low.includes('already been registered')) return 'err.emailTaken';
    if (low.includes('different from the old')) return 'err.samePass';
    if (low.includes('password should be at least') || low.includes('weak password')) return 'err.shortPassword';
    if (low.includes('unable to validate email') || low.includes('invalid format') || low.includes('email address') && low.includes('invalid')) return 'profile.badEmail';
    if (err.status === 429 || low.includes('rate limit') || low.includes('too many')) return 'err.rate';
    if (err.code === '23505' || low.includes('duplicate key')) return 'err.exists';
    if (low.includes('failed to fetch') || low.includes('network') || low.includes('load failed')) return 'err.network';
    return 'err.generic';
  }

  let toastTimer = null;
  function toast(text) {
    const el = document.getElementById('toast'); if (!el) return;
    el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  const secKey = () => 'bb_sec_' + state.uid;
  /** PIN-ը և Face ID-ն պահվում են միայն այս սարքում */
  function currentAccount() { try { return JSON.parse(S.get(secKey()) || '{}'); } catch (e) { return {}; } }
  function updateAccount(fn) { const a = currentAccount(); fn(a); S.set(secKey(), JSON.stringify(a)); return a; }

  let saveTimer = null;
  /** Պահպանում է բյուջեն սերվերում (փոքր ուշացումով, որ շատ հարցումներ չլինեն) */
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 600); }
  async function flushSave() {
    clearTimeout(saveTimer); saveTimer = null;
    if (!sb || !state.uid || !state.data) return;
    const payload = JSON.parse(JSON.stringify(state.data));
    payload.profile = { subscribedEmail: (state.data.profile && state.data.profile.subscribedEmail) || '' };
    try {
      const { error } = await sb.from('budgets').upsert({ user_id: state.uid, data: payload, updated_at: new Date().toISOString() });
      if (error) throw error;
    } catch (e) { toast(t('err.saveFailed')); }
  }
  async function saveProfile(fields) {
    if (!sb || !state.uid) return;
    const { error } = await sb.from('profiles').update(fields).eq('id', state.uid);
    if (error) throw error;
    Object.assign(state.profile, fields);
  }

  // ---------- Հաշվարկներ ----------
  const envById = id => state.data.envelopes.find(e => e.id === id);
  const allocated = env => sum(state.data.incomes, i => sum(i.allocations.filter(a => a.envelopeID === env.id), a => a.amount));
  const spent = env => sum(state.data.expenses.filter(x => x.envelopeID === env.id), x => x.amount);
  const balanceOf = env => allocated(env) - spent(env);
  const totalBalance = () => sum(state.data.envelopes, balanceOf);
  const totalPercent = () => sum(state.data.envelopes, e => e.percent);
  const remaining = () => Math.max(0, 100 - totalPercent());
  const todaySpent = () => sum(state.data.expenses.filter(x => x.date === todayISO()), x => x.amount);
  const monthIncome = () => sum(state.data.incomes.filter(x => isThisMonth(x.date)), x => x.amount);
  const monthSpent = () => sum(state.data.expenses.filter(x => isThisMonth(x.date)), x => x.amount);
  const shownName = () => (state.data.profile.displayName || state.user);

  // ---------- Մուտք / Գրանցում ----------
  function validateUsername(name) {
    if (name.length < 3) throw new Error('err.shortUsername');
    if (!/^[\p{L}\p{N}_.\-]+$/u.test(name)) throw new Error('err.invalidUsername');
  }

  async function usernameFree(name) {
    const { data, error } = await sb.rpc('username_available', { name: name });
    if (error) throw error;
    return !!data;
  }

  async function register(email, username, password, confirm) {
    email = email.trim(); const name = username.trim();
    if (!isEmail(email)) throw new Error('profile.badEmail');
    validateUsername(name);
    if (password.length < 6) throw new Error('err.shortPassword');
    if (password !== confirm) throw new Error('err.mismatch');
    if (!(await usernameFree(name))) throw new Error('err.exists');
    const res = await sb.auth.signUp({ email: email, password: password,
      options: { data: { username: name }, emailRedirectTo: location.origin + location.pathname } });
    if (res.error) throw res.error;
    const u = res.data && res.data.user;
    if (u && Array.isArray(u.identities) && u.identities.length === 0) throw new Error('err.emailTaken');
    if (res.data.session) { await enterWithSession(res.data.session, true, false); return; }
    // Եթե Supabase-ում միացված է «Confirm email»-ը
    state.authMode = 'login'; state.authInfo = 'auth.checkEmail'; state.authEmail = email; render();
  }

  /** Մուտք email-ով կամ մուտքանունով */
  async function login(identifier, password) {
    let email = identifier.trim();
    if (!email || !password) throw new Error('err.wrong');
    if (email.indexOf('@') < 0) {
      // Մուտքանունով. սերվերը email-ը վերադարձնում է միայն ճիշտ գաղտնաբառի դեպքում
      const r = await sb.rpc('email_for_login', { p_username: email, p_password: password });
      if (r.error) throw r.error;
      if (!r.data) throw new Error('err.wrong');
      email = r.data;
    } else if (!isEmail(email)) throw new Error('profile.badEmail');
    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
    if (error) throw error;
    await enterWithSession(data.session, false, false);
  }

  async function sendReset(email) {
    email = email.trim();
    if (!isEmail(email)) throw new Error('profile.badEmail');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) throw error;
  }

  async function setNewPassword(p1, p2) {
    if (p1.length < 6) throw new Error('err.shortPassword');
    if (p1 !== p2) throw new Error('err.mismatch');
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) throw error;
  }

  /** Մուտքից հետո բեռնում է պրոֆիլը և բյուջեն սերվերից */
  async function enterWithSession(session, isNew, fromBoot) {
    state.uid = session.user.id; state.email = session.user.email;
    state.booting = true; render();
    let created = false;
    try {
      let res = await sb.from('profiles').select('*').eq('id', state.uid).maybeSingle();
      if (res.error) throw res.error;
      let prof = res.data;
      if (!prof) {
        // Առաջին մուտք. ստեղծում ենք պրոֆիլը
        const meta = session.user.user_metadata || {};
        let uname = String(meta.username || (state.email || 'user').split('@')[0]).replace(/[^\p{L}\p{N}_.\-]/gu, '').slice(0, 24);
        if (uname.length < 3) uname = 'user' + Math.floor(Math.random() * 9000 + 1000);
        for (let i = 0; i < 3 && !prof; i++) {
          const ins = await sb.from('profiles').insert({ id: state.uid, username: uname, display_name: '', avatar_url: '', lang: lang }).select().single();
          if (!ins.error) prof = ins.data;
          else if (errKey(ins.error) === 'err.exists') uname = uname.slice(0, 24) + '_' + Math.floor(Math.random() * 900 + 100);
          else throw ins.error;
        }
        if (!prof) throw new Error('err.generic');
        created = true;
      }
      const b = await sb.from('budgets').select('data').eq('user_id', state.uid).maybeSingle();
      if (b.error) throw b.error;
      let data = b.data && b.data.data && Array.isArray(b.data.data.envelopes) ? b.data.data : null;
      if (!data) {
        data = defaultData();
        const up = await sb.from('budgets').upsert({ user_id: state.uid, data: data });
        if (up.error) throw up.error;
      }
      data.incomes = data.incomes || []; data.expenses = data.expenses || [];
      data.profile = { displayName: prof.display_name || '', avatar: prof.avatar_url || '',
                       subscribedEmail: (data.profile && data.profile.subscribedEmail) || '' };
      state.profile = prof; state.user = prof.username; state.data = data;
      if (prof.lang && I18N[prof.lang] && prof.lang !== lang) { lang = prof.lang; S.set('bb_lang', lang); }
    } catch (e) {
      state.booting = false; state.user = null; state.data = null; state.uid = null;
      try { await sb.auth.signOut(); } catch (x) {}
      state.authError = errKey(e); render(); return;
    }
    state.booting = false; state.tab = 'home'; state.flash = {};
    const sec = currentAccount();
    if (sec.pin && fromBoot) { lockApp(); return; }
    if (!sec.pin && (isNew || created || (!fromBoot && !sec.pinSkipped))) { startPinSetup(false); return; }
    state.screen = 'app'; render();
  }

  function usernameLockedUntil() {
    const ts = state.profile && state.profile.username_changed_at ? Date.parse(state.profile.username_changed_at) : 0;
    const until = ts ? ts + USERNAME_COOLDOWN : 0;
    return until > Date.now() ? until : 0;
  }

  /** Մուտքանունի փոփոխություն. 7 օրը մեկ անգամ */
  async function changeUsername(newName) {
    const name = newName.trim();
    if (usernameLockedUntil()) throw new Error('set.usernameHint');
    if (name === state.user) throw new Error('set.usernameSame');
    validateUsername(name);
    if (name.toLowerCase() !== state.user.toLowerCase() && !(await usernameFree(name))) throw new Error('err.exists');
    const now = new Date().toISOString();
    await saveProfile({ username: name, username_changed_at: now });
    state.user = name;
  }

  async function changePassword(current, next, repeat) {
    if (next.length < 6) throw new Error('err.shortPassword');
    if (next !== repeat) throw new Error('err.mismatch');
    const chk = await sb.auth.signInWithPassword({ email: state.email, password: current });
    if (chk.error) { const k = errKey(chk.error); throw new Error(k === 'err.wrong' ? 'err.curPass' : k); }
    if (current === next) throw new Error('err.samePass');
    const { error } = await sb.auth.updateUser({ password: next });
    if (error) throw error;
  }

  // ---------- PIN կոդ ----------
  const PIN_LENGTH = 5, PIN_MAX_ATTEMPTS = 5;

  function startPinSetup(fromSettings) {
    if (fromSettings) closeModal();
    state.screen = 'pin-setup';
    state.pin = { mode: 'setup', input: '', first: '', error: null, fromSettings: !!fromSettings, shake: false };
    render();
  }

  function lockApp() {
    state.screen = 'locked';
    state.pin = { mode: 'unlock', input: '', first: '', error: null, fromSettings: false, shake: false };
    render();
  }

  function pinError(key, vars) {
    state.pin.error = { key: key, vars: vars };
    state.pin.input = '';
    state.pin.shake = true;
    render();
    state.pin.shake = false;
  }

  function pinDigit(d) {
    if (state.pin.input.length >= PIN_LENGTH) return;
    state.pin.input += d;
    if (state.pin.input.length === 1) state.pin.error = null;
    render();
    if (state.pin.input.length === PIN_LENGTH) setTimeout(pinComplete, 120);
  }

  function pinBack() { state.pin.input = state.pin.input.slice(0, -1); render(); }

  async function pinComplete() {
    const pin = state.pin, code = pin.input;
    if (code.length !== PIN_LENGTH) return;

    if (pin.mode === 'setup') {
      pin.first = code; pin.input = ''; pin.mode = 'confirm'; render(); return;
    }

    if (pin.mode === 'confirm') {
      if (code !== pin.first) { pin.mode = 'setup'; pin.first = ''; pinError('pin.mismatch'); return; }
      const salt = uid(), hash = await sha256(salt + code);
      const acc = updateAccount(me => { me.pin = { salt: salt, hash: hash }; me.pinAttempts = 0; me.pinSkipped = false; });
      if (pin.fromSettings) { finishToSettings('set.pinSaved', true); return; }
      if (state.bioAvailable && acc && !acc.bio) { state.bioError = ''; state.screen = 'bio-offer'; render(); return; }
      state.screen = 'app'; render(); return;
    }

    if (pin.mode === 'unlock') {
      const acc = currentAccount();
      if (!acc || !acc.pin) { state.screen = 'app'; render(); return; }
      if (await sha256(acc.pin.salt + code) === acc.pin.hash) {
        updateAccount(me => { me.pinAttempts = 0; });
        state.screen = 'app'; render(); return;
      }
      const me = updateAccount(m => { m.pinAttempts = (m.pinAttempts || 0) + 1; });
      const left = PIN_MAX_ATTEMPTS - (me ? me.pinAttempts : PIN_MAX_ATTEMPTS);
      if (left <= 0) {
        updateAccount(m => { m.pinAttempts = 0; });
        logout('err.pinLocked'); return;
      }
      pinError('pin.wrong', { n: left });
    }
  }

  function finishToSettings(key, ok) {
    state.screen = 'app'; state.tab = 'profile'; render();
    openSettings(); state.sflash = { sec: 'security', ok: ok, key: key }; renderSettings();
  }

  // ---------- Face ID / Touch ID (WebAuthn) ----------
  const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  const fromB64 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  async function bioRegister() {
    if (!window.PublicKeyCredential || !navigator.credentials) throw new Error('bio.unavailable');
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: t('app.name') },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: state.user, displayName: shownName() },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      attestation: 'none', timeout: 60000
    } });
    if (!cred) throw new Error('bio.unavailable');
    updateAccount(me => { me.bio = { id: toB64(cred.rawId) }; });
  }

  async function bioVerify() {
    const acc = currentAccount();
    if (!acc || !acc.bio) throw new Error('bio.failed');
    const res = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: fromB64(acc.bio.id) }],
      userVerification: 'required', timeout: 60000
    } });
    if (!res) throw new Error('bio.failed');
  }

  function checkBioAvailable() {
    try {
      if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
          .then(v => { state.bioAvailable = !!v; if (state.user && state.screen !== 'app') render(); })
          .catch(() => {});
      }
    } catch (e) {}
  }

  async function logout(errorKey) {
    if (saveTimer) await flushSave();
    try { if (sb) await sb.auth.signOut(); } catch (e) {}
    state.user = null; state.data = null; state.uid = null; state.profile = null; state.email = '';
    state.selecting = false; state.selected.clear();
    state.authMode = 'login'; state.authError = errorKey || ''; state.authInfo = ''; state.flash = {}; state.screen = 'app';
    closeModal();
    render();
  }

  // ---------- Պատկերակներ ----------
  const ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    tx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>',
    summary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>',
    env: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 13l2.5-8h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>',
    profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5a6.5 6.5 0 0 1 11 0"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
  };
  const TABS = ['home', 'tx', 'summary', 'env', 'profile'];

  function avatarHTML(size) {
    const p = state.data.profile, name = shownName();
    const inner = p.avatar ? '<img src="' + p.avatar + '" alt="">' : esc(Array.from(name)[0].toUpperCase());
    return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.42) + 'px">' + inner + '</div>';
  }

  // ---------- Էկրաններ ----------
  const root = document.getElementById('root');
  const modal = document.getElementById('modal');

  function render() {
    document.documentElement.lang = lang;
    document.title = 'MyBudget';
    if (state.booting) { root.innerHTML = loadingView(); return; }
    if (!state.user || state.recovering) { root.innerHTML = authView(); return; }
    if (state.screen === 'pin-setup' || state.screen === 'locked') { root.innerHTML = pinView(); return; }
    if (state.screen === 'bio-offer') { root.innerHTML = bioOfferView(); return; }
    const views = { home: homeView, tx: txView, summary: summaryView, env: envView, profile: profileView };
    root.innerHTML = '<div class="shell">' + views[state.tab]() + '</div>' +
      '<nav class="tabbar">' + TABS.map(k =>
        '<button class="tab' + (state.tab === k ? ' active' : '') + '" data-action="tab" data-id="' + k + '">' + ICONS[k] + '<span>' + t('tab.' + k) + '</span></button>'
      ).join('') + '</nav>';
  }

  const FACE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1M15 9.5v1M12 9.5V13h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"/></svg>';
  const BACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>';

  function pinView() {
    const pin = state.pin, unlock = pin.mode === 'unlock';
    const acc = currentAccount() || {};
    const title = unlock ? t('pin.enterTitle') : (pin.mode === 'confirm' ? t('pin.repeatTitle') : t('pin.createTitle'));
    const sub = unlock ? esc(shownName()) : (pin.mode === 'confirm' ? t('pin.repeatSub') : t('pin.createSub'));
    const dots = Array.from({ length: PIN_LENGTH }, (_, i) => '<span class="pin-dot' + (i < pin.input.length ? ' on' : '') + '"></span>').join('');
    const showBio = unlock && acc.bio;
    const keys = ['1','2','3','4','5','6','7','8','9'].map(k => '<button class="pin-key" data-action="pin-digit" data-id="' + k + '">' + k + '</button>').join('') +
      (showBio ? '<button class="pin-key ghost accent" data-action="bio-unlock" aria-label="' + t('bio.unlock') + '">' + FACE_ICON + '</button>' : '<span></span>') +
      '<button class="pin-key" data-action="pin-digit" data-id="0">0</button>' +
      '<button class="pin-key ghost" data-action="pin-back" aria-label="⌫">' + BACK_ICON + '</button>';
    let links = '';
    if (unlock) links = '<button class="link" data-action="pin-forgot">' + t('pin.forgot') + '</button>';
    else if (pin.fromSettings) links = '<button class="link" data-action="pin-cancel">' + t('pin.cancel') + '</button>';
    else links = '<button class="link" data-action="pin-skip">' + t('pin.skip') + '</button>';
    return '<div class="pin-screen">' +
      (unlock ? avatarHTML(72) : '<div class="logo" style="margin:0">🔒</div>') +
      '<h2>' + title + '</h2><div class="muted">' + sub + '</div>' +
      '<div class="pin-dots' + (pin.shake ? ' shake' : '') + '">' + dots + '</div>' +
      '<div class="pin-msg">' + (pin.error ? esc(t(pin.error.key, pin.error.vars)) : '') + '</div>' +
      '<div class="pin-pad">' + keys + '</div>' +
      '<div class="pin-links">' + links + '</div></div>';
  }

  function bioOfferView() {

  function envCard(env) {
    const a = allocated(env), s = spent(env), b = a - s;
    const p = a > 0 ? Math.min(Math.max(s / a, 0), 1) : 0;
    const c = colorOf(env);
    return '<div class="card"><div class="row">' +
      '<div class="icon" style="background:' + c + '26">' + esc(env.icon) + '</div>' +
      '<div><div class="bold">' + esc(envName(env)) + '</div><div class="small muted">' + t('env.ofIncome', { p: env.percent }) + '</div></div>' +
      '<div class="spacer"></div><div class="bold" style="' + (b < 0 ? 'color:var(--red)' : '') + '">' + amd(b) + '</div></div>' +
      '<div class="bar"><div style="width:' + (p * 100) + '%;background:' + (p > 0.85 ? 'var(--red)' : c) + '"></div></div>' +
      '<div class="small muted">' + t('env.spentOf', { a: amd(s), b: amd(a) }) + '</div></div>';
  }

  function txView() {
    const items = state.data.incomes.map(i => ({ kind: 'income', x: i }))
      .concat(state.data.expenses.map(e => ({ kind: 'expense', x: e })));
    if (!items.length) {
      return '<div class="title">' + t('tab.tx') + '</div><div class="empty"><div>🗂️</div><b>' + t('tx.empty') + '</b><p>' + t('tx.emptyHint') + '</p></div>';
    }
    items.sort((p, q) => (q.x.date.localeCompare(p.x.date)) || ((q.x.createdAt || 0) - (p.x.createdAt || 0)));
    const groups = [];
    items.forEach(it => {
      const last = groups[groups.length - 1];
      if (last && last.day === it.x.date) last.items.push(it); else groups.push({ day: it.x.date, items: [it] });
    });
    return '<div class="title">' + t('tab.tx') + '</div>' + groups.map(g =>
      '<div class="label">' + fmtDay(g.day) + '</div><div class="list">' + g.items.map(txRow).join('') + '</div>'
    ).join('');
  }

  function summaryView() {
    const inc = monthIncome(), sp = monthSpent(), diff = inc - sp;
    const slices = state.data.envelopes.map(env => ({
      name: envName(env), color: colorOf(env),
      amount: sum(state.data.expenses.filter(x => x.envelopeID === env.id && isThisMonth(x.date)), x => x.amount)
    })).filter(s => s.amount > 0);

    let donut = '<div class="card muted">' + t('sum.noSpend') + '</div>';
    if (slices.length) {
      const total = sum(slices, s => s.amount), r = 70, C = 2 * Math.PI * r;
      let offset = 0;
      const arcs = slices.map(s => {
        const len = s.amount / total * C;
        const gap = slices.length > 1 ? Math.min(3, len / 3) : 0;
        const arc = '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="26" stroke-dasharray="' + Math.max(len - gap, 0.1) + ' ' + C + '" stroke-dashoffset="' + (-offset) + '"/>';
        offset += len; return arc;
      }).join('');
      donut = '<div class="card"><svg viewBox="0 0 200 200" style="width:220px;display:block;margin:6px auto 12px"><g transform="rotate(-90 100 100)">' + arcs + '</g>' +
        '<text x="100" y="96" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">' + esc(t('sum.center')) + '</text>' +
        '<text x="100" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">' + amd(total) + '</text></svg>' +
        '<div class="stack">' + slices.map(s => '<div class="row"><span class="legend-dot" style="background:' + s.color + '"></span><span>' + esc(s.name) + '</span><span class="spacer"></span><b>' + amd(s.amount) + '</b></div>').join('') + '</div></div>';
    }

    const days = [];
    for (let k = 6; k >= 0; k--) {
      const d = new Date(); d.setDate(d.getDate() - k);
      const iso = isoOf(d);
      days.push({ label: WEEK[lang][d.getDay()], amount: sum(state.data.expenses.filter(x => x.date === iso), x => x.amount) });
    }
    const max = Math.max(1, ...days.map(d => d.amount));
    const bars = days.map((d, i) => {
      const h = d.amount / max * 110, x = 12 + i * 41;
      return '<rect x="' + x + '" y="' + (125 - h) + '" width="26" height="' + Math.max(h, 2) + '" rx="5" fill="' + (d.amount ? '#ef4444' : 'currentColor') + '" opacity="' + (d.amount ? 1 : .15) + '"/>' +
        '<text x="' + (x + 13) + '" y="145" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">' + d.label + '</text>';
    }).join('');

    return '<div class="title">' + t('tab.summary') + '</div>' +
      '<div class="label">' + t('sum.month') + '</div><div class="list">' +
      '<div class="item row"><span>' + t('sum.income') + '</span><span class="spacer"></span><b style="color:var(--green)">' + amd(inc) + '</b></div>' +
      '<div class="item row"><span>' + t('sum.spent') + '</span><span class="spacer"></span><b style="color:var(--red)">' + amd(sp) + '</b></div>' +
      '<div class="item row"><span>' + t('sum.diff') + '</span><span class="spacer"></span><b style="color:' + (diff >= 0 ? 'var(--accent)' : 'var(--orange)') + '">' + amd(diff) + '</b></div></div>' +
      '<div class="label">' + t('sum.byEnv') + '</div>' + donut +
      '<div class="label">' + t('sum.week') + '</div><div class="card"><svg viewBox="0 0 300 150" style="width:100%;display:block">' + bars + '</svg>' +
      '<div class="small muted" style="text-align:right">' + t('sum.max', { v: amd(Math.max(...days.map(d => d.amount))) }) + '</div></div>';
  }

      '<div class="label">' + t('env.split') + '</div>' +

    const acc = currentAccount() || {};
    let rows = '<div class="item row"><span>🔢</span><span>' + (acc.pin ? t('set.pinOn') : t('set.pinOff')) + '</span>' +

      '<button class="list-btn accent" data-action="pin-setup-settings">' + (acc.pin ? t('set.pinChange') : t('set.pinSet')) + '</button>';
    if (acc.pin) {
      rows += acc.bio
        ? '<button class="list-btn danger" data-action="bio-off">' + t('set.bioOff') + '</button>'

      (hint ? '<div class="hint">' + hint + '</div>' : '');

  }

  function openSettings() { state.settingsOpen = true; state.sflash = {}; renderSettings(); }

  /** Թարմացնում է էջը և, եթե բաց է, կարգավորումների պատուհանը */
  function refresh() { render(); if (state.settingsOpen && state.user) renderSettings(); }

  function updateSubscribeLink() {
    const input = document.getElementById('sub-email'), b = document.getElementById('sub-send');
    if (input && b) b.classList.toggle('off', !input.value.trim());
  }

  // ---------- Ավատար ----------
  function loadAvatar(file) {
    const fail = () => { state.sflash = { sec: 'photo', key: 'profile.photoErr' }; refresh(); };
    if (!file || !/^image\//.test(file.type)) { fail(); return; }
    const reader = new FileReader();
    reader.onerror = fail;
    reader.onload = () => {
      const img = new Image();
      img.onerror = fail;
      img.onload = () => {
        // Կտրում ենք քառակուսի և փոքրացնում 256×256, որ քիչ տեղ զբաղեցնի
        const size = 256, c = document.createElement('canvas');
        c.width = size; c.height = size;
        const side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        let url = '';
        try { url = c.toDataURL('image/jpeg', 0.82); } catch (e) { fail(); return; }
        saveProfile({ avatar_url: url })
          .then(() => { state.data.profile.avatar = url; state.sflash = {}; refresh(); })
          .catch(err => { state.sflash = { sec: 'photo', key: errKey(err) }; refresh(); });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- Մոդալ պատուհաններ ----------
  let onConfirm = null;
  let expenseEnvID = null;

  function closeModal() { modal.innerHTML = ''; onConfirm = null; state.settingsOpen = false; state.sflash = {}; }

  function confirmDialog(title, message, okText, fn, single) {
    onConfirm = fn;
    modal.innerHTML = '<div class="overlay center"><div class="dialog"><h3>' + esc(title) + '</h3><p>' + esc(message) + '</p>' +
      '<div class="row">' + (single ? '' : '<button class="btn btn-soft" data-action="close-modal">' + t('m.cancel') + '</button>') +
      '<button class="btn ' + (single ? 'btn-primary' : 'btn-danger') + '" data-action="confirm-ok">' + esc(okText) + '</button></div></div></div>';
  }

  function sheetHead(titleKey, saveId, saveAction) {
    return '<div class="sheet-head"><button class="link" data-action="close-modal">' + t('m.cancel') + '</button><b>' + t(titleKey) + '</b>' +
      '<button class="link bold" id="' + saveId + '" data-action="' + saveAction + '" disabled>' + t('m.save') + '</button></div>';
  }

  function openIncome() {
    modal.innerHTML = '<div class="overlay"><div class="sheet">' + sheetHead('inc.title', 'inc-save', 'save-income') +
      '<div class="label">' + t('m.amount') + '</div><div class="stack">' +
      '<input class="field big" id="inc-amount" inputmode="decimal" placeholder="' + t('inc.amountPh') + '">' +
      '<input class="field" id="inc-note" placeholder="' + t('inc.notePh') + '" maxlength="60">' +
      '<input class="field" id="inc-date" type="date" value="' + todayISO() + '"></div>' +
      '<div id="inc-preview"></div></div></div>';
    updateIncomePreview();
    setTimeout(() => { const el = document.getElementById('inc-amount'); if (el) el.focus(); }, 50);
  }

  function updateIncomePreview() {
    const el = document.getElementById('inc-amount'); if (!el) return;
    const parts = distribute(parseAmount(el.value) || 0, state.data.envelopes);
    document.getElementById('inc-save').disabled = !parts.length;
    document.getElementById('inc-preview').innerHTML = parts.length
      ? '<div class="label">' + t('inc.split') + '</div><div class="list">' + parts.map(p => {
          const env = envById(p.envelopeID);
          return '<div class="item row"><span>' + esc(env.icon) + '</span><span>' + esc(envName(env)) + '</span><span class="spacer"></span><b>' + amd(p.amount) + '</b></div>';
        }).join('') + '</div>'
      : (state.data.envelopes.some(e => e.percent > 0) ? '' : '<div class="hint" style="color:var(--orange)">' + t('inc.noPercent') + '</div>');
  }

  function saveIncome() {
    const amount = parseAmount(document.getElementById('inc-amount').value);
    const parts = distribute(amount || 0, state.data.envelopes);
    if (!parts.length) return;
    state.data.incomes.push({
      id: uid(), amount: amount, note: document.getElementById('inc-note').value.trim(),
      date: document.getElementById('inc-date').value || todayISO(), allocations: parts, createdAt: Date.now()
    });
    save(); closeModal(); render();
  }

  function openExpense() {
    const envs = state.data.envelopes;
    if (!envs.length) { confirmDialog(t('exp.noEnvTitle'), t('exp.noEnvMsg'), t('m.ok'), () => {}, true); return; }
    expenseEnvID = envs[0].id;
    modal.innerHTML = '<div class="overlay"><div class="sheet">' + sheetHead('exp.title', 'exp-save', 'save-expense') +
      '<div class="label">' + t('m.amount') + '</div><div class="stack">' +
      '<input class="field big" id="exp-amount" inputmode="decimal" placeholder="' + t('exp.amountPh') + '">' +
      '<input class="field" id="exp-note" placeholder="' + t('exp.notePh') + '" maxlength="60">' +
      '<input class="field" id="exp-date" type="date" value="' + todayISO() + '"></div>' +
      '<div class="label">' + t('exp.from') + '</div><div class="list" id="exp-envs">' + envs.map(env =>
        '<button class="pick' + (env.id === expenseEnvID ? ' on' : '') + '" data-action="pick-env" data-id="' + env.id + '">' +
        '<span>' + esc(env.icon) + '</span><span>' + esc(envName(env)) + '</span><span class="check">✓</span></button>').join('') + '</div>' +
      '<div id="exp-info"></div></div></div>';
    updateExpenseInfo();
    setTimeout(() => { const el = document.getElementById('exp-amount'); if (el) el.focus(); }, 50);
  }

  function updateExpenseInfo() {
    const box = document.getElementById('exp-info'); if (!box) return;
    const env = envById(expenseEnvID);
    const amount = parseAmount(document.getElementById('exp-amount').value);
    document.getElementById('exp-save').disabled = !(amount && env);
    if (!env) { box.innerHTML = ''; return; }
    const b = balanceOf(env);
    box.innerHTML = '<div class="list" style="margin-top:16px"><div class="item row"><span>' + t('exp.balance') + '</span><span class="spacer"></span><b>' + amd(b) + '</b></div>' +
      (amount && amount > b ? '<div class="item small" style="color:var(--orange)">' + t('exp.over') + '</div>' : '') + '</div>';
  }

  function saveExpense() {
    const amount = parseAmount(document.getElementById('exp-amount').value);
    if (!amount || !envById(expenseEnvID)) return;
    state.data.expenses.push({
      id: uid(), amount: amount, note: document.getElementById('exp-note').value.trim(),
      date: document.getElementById('exp-date').value || todayISO(), envelopeID: expenseEnvID, createdAt: Date.now()
    });
    save(); closeModal(); render();
  }

  function deleteEnvelopes(ids) {
    const d = state.data;
    d.envelopes = d.envelopes.filter(e => !ids.has(e.id));
    d.expenses = d.expenses.filter(x => !ids.has(x.envelopeID));
    d.incomes.forEach(i => { i.allocations = i.allocations.filter(a => !ids.has(a.envelopeID)); });
    d.incomes = d.incomes.filter(i => i.allocations.length > 0);
    save();
  }

  // ---------- Իրադարձություններ ----------
  document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('overlay')) { closeModal(); return; }

    const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
    const id = el.dataset.id;
    switch (el.dataset.action) {
      case 'tab': state.tab = id; state.selecting = false; state.selected.clear(); state.flash = {}; render(); try { window.scrollTo(0, 0); } catch (err) {} break;
      case 'lang': setLang(id); break;
      case 'auth-mode': state.authMode = id; state.authError = ''; state.authInfo = ''; render(); break;
      case 'open-income': openIncome(); break;
      case 'open-expense': openExpense(); break;
      case 'close-modal': closeModal(); break;
      case 'confirm-ok': { const fn = onConfirm; closeModal(); if (fn) fn(); break; }
      case 'save-income': saveIncome(); break;
      case 'save-expense': saveExpense(); break;
      case 'pick-env':
        expenseEnvID = id;
        document.querySelectorAll('#exp-envs .pick').forEach(b => b.classList.toggle('on', b.dataset.id === id));
        updateExpenseInfo(); break;
      case 'del-income':
        confirmDialog(t('c.delIncTitle'), t('c.delIncMsg'), t('m.delete'), () => {
          state.data.incomes = state.data.incomes.filter(i => i.id !== id); save(); render();
        }); break;
      case 'del-expense':
        confirmDialog(t('c.delExpTitle'), t('c.delExpMsg'), t('m.delete'), () => {
          state.data.expenses = state.data.expenses.filter(x => x.id !== id); save(); render();
        }); break;
      case 'env-minus': { const env = envById(id); if (env) { env.percent = Math.max(0, env.percent - 5); save(); render(); } break; }
      case 'env-plus': { const env = envById(id); const rem = remaining(); if (env && rem > 0) { env.percent += Math.min(5, rem); save(); render(); } break; }
      case 'env-add': {
        const icons = ['📁','✈️','🎁','🚗','💊','📚','👕','☕️'];
        const n = state.data.envelopes.length;
        state.data.envelopes.push({ id: uid(), key: 'new', name: '', percent: 0, icon: icons[n % icons.length], color: COLOR_KEYS[n % COLOR_KEYS.length] });
        save(); render(); break;
      }
      case 'env-select-start': state.selecting = true; state.selected.clear(); render(); break;
      case 'env-select-cancel': state.selecting = false; state.selected.clear(); render(); break;
      case 'env-toggle': if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id); render(); break;
      case 'env-delete-selected':
        confirmDialog(t('c.delEnvTitle', { n: state.selected.size }), t('c.delEnvMsg'), t('m.delete'), () => {
          deleteEnvelopes(new Set(state.selected)); state.selecting = false; state.selected.clear(); render();
        }); break;
      case 'open-settings': openSettings(); break;
      case 'pin-digit': pinDigit(id); break;
      case 'pin-back': pinBack(); break;
      case 'pin-skip': updateAccount(me => { me.pinSkipped = true; }); state.screen = 'app'; render(); break;
      case 'pin-cancel': finishToSettings('', true); state.sflash = {}; renderSettings(); break;
      case 'pin-forgot': logout('pin.forgotMsg'); break;
      case 'pin-setup-settings': startPinSetup(true); break;
      case 'pin-remove':
        confirmDialog(t('c.pinRemoveTitle'), t('c.pinRemoveMsg'), t('c.remove'), () => {
          updateAccount(me => { delete me.pin; delete me.bio; me.pinAttempts = 0; me.pinSkipped = true; });
          finishToSettings('set.pinRemoved', true);
        }); break;
      case 'bio-unlock':
        bioVerify().then(() => { updateAccount(me => { me.pinAttempts = 0; }); state.screen = 'app'; render(); })
          .catch(() => { state.pin.error = { key: 'bio.failed' }; render(); });
        break;
      case 'bio-enable-offer':
        bioRegister().then(() => { state.screen = 'app'; render(); })
          .catch(() => { state.bioError = 'bio.unavailable'; render(); });
        break;
      case 'bio-later': state.bioError = ''; state.screen = 'app'; render(); break;
      case 'bio-on':
        bioRegister().then(() => { state.sflash = { sec: 'security', ok: true, key: 'bio.enabled' }; refresh(); })
          .catch(() => { state.sflash = { sec: 'security', key: 'bio.unavailable' }; refresh(); });
        break;
      case 'bio-off': updateAccount(me => { delete me.bio; }); state.sflash = { sec: 'security', ok: true, key: 'bio.disabled' }; refresh(); break;
      case 'subscribe': {
        const input = document.getElementById('sub-email');
        const email = input ? input.value.trim() : '';
        state.flash = {};
        if (!isEmail(email)) { state.flash.sub = 'profile.badEmail'; render(); restoreEmail(email); break; }
        el.disabled = true;
        sb.from('subscribers').insert({ user_id: state.uid, email: email })
          .then(({ error }) => {
            if (error) throw error;
            state.data.profile.subscribedEmail = email; save(); render();
          })
          .catch(err => { state.flash.sub = errKey(err); render(); restoreEmail(email); });
        break;
      }
      case 'save-name': {
        const input = document.getElementById('display-name');
        const name = input ? input.value.trim().slice(0, 40) : '';
        saveProfile({ display_name: name })
          .then(() => { state.data.profile.displayName = name; state.sflash = { sec: 'name', ok: true, key: 'profile.saved' }; refresh(); })
          .catch(err => { state.sflash = { sec: 'name', key: errKey(err) }; refresh(); });
        break;
      }
      case 'avatar-remove':
        saveProfile({ avatar_url: '' })
          .then(() => { state.data.profile.avatar = ''; state.sflash = {}; refresh(); })
          .catch(err => { state.sflash = { sec: 'photo', key: errKey(err) }; refresh(); });
        break;
      case 'save-username': {
        const input = document.getElementById('new-username');
        const value = input ? input.value : '';
        el.disabled = true;
        changeUsername(value)
          .then(() => { state.sflash = { sec: 'username', ok: true, key: 'set.usernameSaved' }; refresh(); })
          .catch(err => {
            state.sflash = { sec: 'username', key: errKey(err) }; refresh();
            const again = document.getElementById('new-username'); if (again && !again.disabled) again.value = value;
          });
        break;
      }
      case 'save-password': {
        const v = i => { const el = document.getElementById(i); return el ? el.value : ''; };
        changePassword(v('cur-pass'), v('new-pass'), v('new-pass2'))
          .then(() => { state.sflash = { sec: 'password', ok: true, key: 'set.passSaved' }; refresh(); })
          .catch(err => { state.sflash = { sec: 'password', key: errKey(err) }; refresh(); });
        break;
      }
      case 'logout': confirmDialog(t('c.logoutTitle'), t('c.logoutMsg'), t('c.logoutOk'), () => logout()); break;
    }
  });

  function restoreEmail(email) {
    const input = document.getElementById('sub-email');
    if (input) { input.value = email; updateSubscribeLink(); }
  }

  document.addEventListener('input', e => {
    const tg = e.target;
    if (tg.id === 'inc-amount') updateIncomePreview();
    else if (tg.id === 'exp-amount') updateExpenseInfo();
    else if (tg.id === 'sub-email') updateSubscribeLink();
    else if (tg.dataset && tg.dataset.envName) {
      const env = envById(tg.dataset.envName);
      if (env) { env.name = tg.value.trim() || t('env.unnamed'); save(); }
    }
  });

  document.addEventListener('change', e => {
    if (e.target.id === 'avatar-input' && e.target.files && e.target.files[0]) loadAvatar(e.target.files[0]);
  });

  document.addEventListener('keydown', e => {
    if (state.user && (state.screen === 'pin-setup' || state.screen === 'locked') && !modal.innerHTML) {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pinDigit(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); pinBack(); return; }
    }
    if (e.key === 'Escape' && modal.innerHTML) closeModal();
    if (e.key === 'Enter' && e.target.id === 'display-name') { e.preventDefault(); const b = document.querySelector('[data-action="save-name"]'); if (b) b.click(); }
  });

  document.addEventListener('submit', async e => {
    if (e.target.id !== 'auth-form') return;
    e.preventDefault();
    if (state.busy) return;
    if (!sb) { state.authError = 'err.noServer'; render(); return; }
    const f = e.target;
    const val = n => { const el = f.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
    const email = val('email'), username = val('username'), p = val('password'), c = val('confirm');
    const mode = state.recovering ? 'newpass' : state.authMode;
    state.authEmail = email; state.authError = ''; state.authInfo = ''; state.busy = true; render();
    try {
      if (mode === 'login') await login(email, p);
      else if (mode === 'register') await register(email, username, p, c);
      else if (mode === 'reset') { await sendReset(email); state.authInfo = 'auth.linkSent'; }
      else {
        await setNewPassword(p, c);
        state.recovering = false; state.busy = false;
        try { history.replaceState(null, '', location.pathname); } catch (x) {}
        const { data } = await sb.auth.getSession();
        if (data.session) { toast(t('auth.passUpdated')); await enterWithSession(data.session, false, false); return; }
        state.authMode = 'login'; state.authInfo = 'auth.passUpdated';
      }
    } catch (err) {
      state.authError = errKey(err);
    }
    state.busy = false;
    if (!state.user || state.recovering) {
      render();
      const nf = document.getElementById('auth-form');
      if (nf && username) { const u = nf.querySelector('[name="username"]'); if (u) u.value = username; }
    }
  });

  // ---------- Սկիզբ ----------
  async function boot() {
    checkBioAvailable();
    if (!sb) { state.booting = false; state.authError = 'err.noServer'; render(); return; }
    // Գաղտնաբառի վերականգնման հղումով եկած լինելու դեպքում
    if (/type=recovery/.test(location.hash)) state.recovering = true;
    sb.auth.onAuthStateChange(event => {
      if (event === 'PASSWORD_RECOVERY') { state.recovering = true; state.booting = false; state.authError = ''; render(); }
    });
    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session && !state.recovering) { await enterWithSession(data.session, false, true); return; }
    } catch (e) { state.authError = 'err.network'; }
    state.booting = false; render();
  }
  render();
  boot();
})();
</script>
</body>
</html>
